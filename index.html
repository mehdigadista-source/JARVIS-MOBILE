
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S MOBILE</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #050b16;
    color: #d9f5ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    text-align: center;
    padding: 22px 10px;
    border-bottom: 1px solid #087fa8;
    color: #42d9ff;
    letter-spacing: 4px;
}

header h1 { margin: 0; font-size: 25px; }
header p { font-size: 11px; letter-spacing: 2px; }

#reactor {
    width: 100px;
    height: 100px;
    border: 3px solid #28cfff;
    border-radius: 50%;
    margin: 25px auto;
    box-shadow: 0 0 25px #00bfff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #70eaff;
    font-size: 28px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { box-shadow: 0 0 45px #00bfff; }
}

#status {
    text-align: center;
    color: #39dfff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

#messages {
    flex: 1;
    width: 92%;
    max-width: 750px;
    margin: auto;
    padding: 15px;
    overflow-y: auto;
    min-height: 250px;
    max-height: 55vh;
}

.message {
    padding: 13px;
    margin: 10px 0;
    border-radius: 8px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #102b45;
    border-left: 3px solid #3b9cff;
}

.jarvis {
    background: #092d35;
    border-left: 3px solid #26dfff;
}

#controls {
    width: 92%;
    max-width: 750px;
    margin: 15px auto 30px;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #168bb4;
    border-radius: 6px;
    background: #091727;
    color: white;
    outline: none;
}

button {
    padding: 12px 15px;
    border: 1px solid #22cfff;
    border-radius: 6px;
    background: #08283a;
    color: #54dfff;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#clear {
    display: block;
    margin: 0 auto 20px;
}
</style>
</head>

<body>

<header>
    <h1>J.A.R.V.I.S</h1>
    <p>STARK INDUSTRIES • MOBILE SYSTEM</p>
</header>

<div id="reactor">J</div>
<div id="status">SYSTÈME EN ATTENTE</div>

<div id="messages">
    <div class="message jarvis">
        Bonjour Monsieur. J.A.R.V.I.S est opérationnel. Comment puis-je vous aider ?
    </div>
</div>

<div id="controls">
    <input id="question" type="text" placeholder="Écrivez votre message..." autocomplete="off">
    <button id="send" onclick="envoyer()">Envoyer</button>
    <button id="voice" onclick="parler()">🎙️</button>
</div>

<button id="clear" onclick="effacer()">Effacer la conversation</button>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("question");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

let historique = [];

function ajouterMessage(texte, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = texte;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

async function envoyer() {
    const texte = input.value.trim();

    if (!texte || sendButton.disabled) return;

    ajouterMessage(texte, "user");
    historique.push({ role: "user", content: texte });

    input.value = "";
    sendButton.disabled = true;
    statusText.textContent = "J.A.R.V.I.S RÉFLÉCHIT...";

    try {
        const reponse = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: historique.slice(-12)
            })
        });

        const donnees = await reponse.json();

        if (!reponse.ok) {
            throw new Error(
                donnees.details || donnees.error || "Erreur du serveur"
            );
        }

        if (!donnees.reply) {
            throw new Error("Le serveur n'a renvoyé aucune réponse.");
        }

        historique.push({
            role: "assistant",
            content: donnees.reply
        });

        ajouterMessage(donnees.reply, "jarvis");
        statusText.textContent = "SYSTÈME OPÉRATIONNEL";

    } catch (erreur) {
        ajouterMessage("Erreur : " + erreur.message, "jarvis");
        statusText.textContent = "ERREUR DE CONNEXION";
    } finally {
        sendButton.disabled = false;
        input.focus();
    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") envoyer();
});

function effacer() {
    historique = [];
    messages.innerHTML = "";
    ajouterMessage("Conversation effacée. Je suis à votre écoute, Monsieur.", "jarvis");
    statusText.textContent = "SYSTÈME EN ATTENTE";
}

function parler() {
    const Reconnaissance =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Reconnaissance) {
        ajouterMessage("La reconnaissance vocale n'est pas disponible sur ce navigateur.", "jarvis");
        return;
    }

    const reconnaissance = new Reconnaissance();
    reconnaissance.lang = "fr-FR";
    reconnaissance.interimResults = false;

    reconnaissance.onstart = function() {
        statusText.textContent = "JE VOUS ÉCOUTE...";
    };

    reconnaissance.onresult = function(event) {
        input.value = event.results[0][0].transcript;
        envoyer();
    };

    reconnaissance.onerror = function() {
        statusText.textContent = "ERREUR MICRO";
    };

    reconnaissance.onend = function() {
        if (statusText.textContent === "JE VOUS ÉCOUTE...") {
            statusText.textContent = "SYSTÈME EN ATTENTE";
        }
    };

    reconnaissance.start();
}
</script>

</body>
</html>
