
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S MOBILE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #050b16;
    color: #d9f5ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    text-align: center;
    padding: 22px 10px;
    border-bottom: 1px solid #087fa8;
    color: #42d9ff;
    letter-spacing: 4px;
}

header h1 { margin: 0; font-size: 25px; }
header p { font-size: 11px; letter-spacing: 2px; }

#reactor {
    width: 100px;
    height: 100px;
    border: 3px solid #28cfff;
    border-radius: 50%;
    margin: 25px auto;
    box-shadow: 0 0 25px #00bfff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #70eaff;
    font-size: 28px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { box-shadow: 0 0 45px #00bfff; }
}

#status {
    text-align: center;
    color: #39dfff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

#login {
    width: 92%;
    max-width: 450px;
    margin: 10px auto 20px;
    padding: 18px;
    border: 1px solid #168bb4;
    border-radius: 8px;
    background: #091727;
}

#login h3 {
    text-align: center;
    color: #42d9ff;
}

#login input {
    width: 100%;
    margin: 7px 0;
}

#login button {
    width: 100%;
    margin-top: 8px;
}

#account {
    text-align: center;
    margin: 10px;
    font-size: 12px;
    color: #42d9ff;
}

#messages {
    flex: 1;
    width: 92%;
    max-width: 750px;
    margin: auto;
    padding: 15px;
    overflow-y: auto;
    min-height: 250px;
    max-height: 55vh;
}

.message {
    padding: 13px;
    margin: 10px 0;
    border-radius: 8px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #102b45;
    border-left: 3px solid #3b9cff;
}

.jarvis {
    background: #092d35;
    border-left: 3px solid #26dfff;
}

#controls {
    width: 92%;
    max-width: 750px;
    margin: 15px auto 30px;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #168bb4;
    border-radius: 6px;
    background: #091727;
    color: white;
    outline: none;
}

button {
    padding: 12px 15px;
    border: 1px solid #22cfff;
    border-radius: 6px;
    background: #08283a;
    color: #54dfff;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#clear {
    display: block;
    margin: 0 auto 20px;
}

.hidden { display: none !important; }

@media(max-width: 500px) {
    #controls { flex-wrap: wrap; }
    #question { width: 100%; flex-basis: 100%; }
}
</style>
</head>

<body>

<header>
    <h1>J.A.R.V.I.S</h1>
    <p>STARK INDUSTRIES • MOBILE SYSTEM</p>
</header>

<div id="reactor">J</div>
<div id="status">SYSTÈME EN ATTENTE</div>

<div id="login">
    <h3>CONNEXION J.A.R.V.I.S</h3>
    <input id="email" type="email" placeholder="Adresse e-mail">
    <input id="password" type="password" placeholder="Mot de passe">
    <button id="loginButton" onclick="connecter()">Se connecter</button>
    <p id="loginError"></p>
</div>

<div id="account" class="hidden">
    <span id="accountEmail"></span>
    <button onclick="deconnecter()">Déconnexion</button>
</div>

<div id="messages"></div>

<div id="controls">
    <input id="question" type="text"
    placeholder="Écrivez votre message..."
    autocomplete="off">

    <button id="send" onclick="envoyer()">Envoyer</button>
    <button id="voice" onclick="parler()">🎙️</button>
</div>

<button id="clear" onclick="effacer()">Effacer la conversation</button>

<script>
// =====================================
// CONFIGURATION SUPABASE
// =====================================

// Remplace ces deux valeurs par celles de TON projet.
const SUPABASE_URL = "https://bziagqjvxahcivlvsaqa.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_obzu6X0MsMpDyLpYh4a6qA_tUvMEvmW";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// =====================================
// ÉLÉMENTS DE L'INTERFACE
// =====================================

const messages = document.getElementById("messages");
const input = document.getElementById("question");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

let historique = [];
let utilisateur = null;
let souvenirs = [];

// =====================================
// MÉMOIRE LOCALE
// =====================================

function chargerHistorique() {
    try {
        const sauvegarde = JSON.parse(
            localStorage.getItem("jarvis_memoire") || "[]"
        );

        if (Array.isArray(sauvegarde)) {
            historique = sauvegarde.filter(message =>
                message &&
                ["user", "assistant"].includes(message.role) &&
                typeof message.content === "string"
            ).slice(-12);
        }
    } catch {
        historique = [];
    }
}

function sauvegarderMemoire() {
    localStorage.setItem(
        "jarvis_memoire",
        JSON.stringify(historique)
    );
}

chargerHistorique();

// =====================================
// AFFICHAGE
// =====================================

function ajouterMessage(texte, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = texte;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function chargerConversation() {
    messages.innerHTML = "";

    if (historique.length === 0) {
        ajouterMessage(
            "Bonjour Monsieur. J.A.R.V.I.S est opérationnel. Comment puis-je vous aider ?",
            "jarvis"
        );
        return;
    }

    historique.forEach(message => {
        ajouterMessage(
            message.content,
            message.role === "user" ? "user" : "jarvis"
        );
    });
}

chargerConversation();

// =====================================
// CONNEXION SUPABASE
// =====================================

async function connecter() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const error = document.getElementById("loginError");

    error.textContent = "";

    if (!email || !password) {
        error.textContent = "Veuillez remplir les deux champs.";
        return;
    }

    document.getElementById("loginButton").disabled = true;
    statusText.textContent = "CONNEXION EN COURS...";

    try {
        const { data, error: authError } =
            await client.auth.signInWithPassword({
                email,
                password
            });

        if (authError) throw authError;

        utilisateur = data.user;

        document.getElementById("login").classList.add("hidden");
        document.getElementById("account").classList.remove("hidden");
        document.getElementById("accountEmail").textContent =
            "Connecté : " + utilisateur.email;

        await chargerSouvenirs();

        statusText.textContent = "SYSTÈME OPÉRATIONNEL";

        ajouterMessage(
            "Connexion réussie. Ma mémoire longue durée est activée, Monsieur.",
            "jarvis"
        );

    } catch (erreur) {
        error.textContent = "Connexion impossible : " + erreur.message;
        statusText.textContent = "ERREUR DE CONNEXION";
    } finally {
        document.getElementById("loginButton").disabled = false;
    }
}

// =====================================
// DÉCONNEXION
// =====================================

async function deconnecter() {
    await client.auth.signOut();

    utilisateur = null;
    souvenirs = [];

    document.getElementById("login").classList.remove("hidden");
    document.getElementById("account").classList.add("hidden");

    statusText.textContent = "DÉCONNECTÉ";
    ajouterMessage("Déconnexion effectuée.", "jarvis");
}

// =====================================
// CHARGER LES SOUVENIRS SUPABASE
// =====================================

async function chargerSouvenirs() {
    if (!utilisateur) return;

    const { data, error } = await client
        .from("jarvis_memory")
        .select("id, memory, category, created_at")
        .eq("owner_id", utilisateur.id)
        .order("created_at", { ascending: false })
        .limit(30);

    if (error) {
        console.error(error);
        throw error;
    }

    souvenirs = data || [];
}

// =====================================
// SAUVEGARDER UN SOUVENIR
// =====================================

async function enregistrerSouvenir(texte) {
    if (!utilisateur) {
        ajouterMessage(
            "Veuillez vous connecter pour utiliser la mémoire longue durée.",
            "jarvis"
        );
        return;
    }

    if (!texte || texte.length > 500) {
        ajouterMessage("Ce souvenir est vide ou trop long.", "jarvis");
        return;
    }

    const interdit = /mot de passe|password|code bancaire|carte bancaire|adresse exacte|diagnostic médical/i;

    if (interdit.test(texte)) {
        ajouterMessage(
            "Je ne peux pas enregistrer ce type d'information sensible.",
            "jarvis"
        );
        return;
    }

    const { error } = await client
        .from("jarvis_memory")
        .insert({
            owner_id: utilisateur.id,
            memory: texte,
            category: "general"
        });

    if (error) {
        ajouterMessage("Erreur de sauvegarde : " + error.message, "jarvis");
        return;
    }

    await chargerSouvenirs();

    ajouterMessage(
        "Souvenir enregistré dans ma mémoire longue durée, Monsieur.",
        "jarvis"
    );
}

// =====================================
// OUBLIER UN SOUVENIR
// =====================================

async function oublierSouvenir(texte) {
    if (!utilisateur) {
        ajouterMessage("Veuillez vous connecter d'abord.", "jarvis");
        return;
    }

    const recherche = texte.toLowerCase();

    const correspondances = souvenirs.filter(s =>
        s.memory.toLowerCase().includes(recherche)
    );

    if (correspondances.length === 0) {
        ajouterMessage("Je n'ai pas trouvé ce souvenir.", "jarvis");
        return;
    }

    const ids = correspondances.map(s => s.id);

    const { error } = await client
        .from("jarvis_memory")
        .delete()
        .in("id", ids)
        .eq("owner_id", utilisateur.id);

    if (error) {
        ajouterMessage("Erreur : " + error.message, "jarvis");
        return;
    }

    await chargerSouvenirs();

    ajouterMessage(
        "Le souvenir demandé a été supprimé de ma mémoire longue durée.",
        "jarvis"
    );
}

// =====================================
// COMMANDES DE MÉMOIRE
// =====================================

function traiterCommandeMemoire(texte) {
    const minuscule = texte.toLowerCase();

    const commandesMemoire = [
        "retiens que ",
        "souviens-toi que ",
        "mémorise que "
    ];

    for (const commande of commandesMemoire) {
        if (minuscule.startsWith(commande)) {
            enregistrerSouvenir(texte.slice(commande.length).trim());
            return true;
        }
    }

    const commandesOubli = [
        "oublie que ",
        "oublie "
    ];

    for (const commande of commandesOubli) {
        if (minuscule.startsWith(commande)) {
            oublierSouvenir(texte.slice(commande.length).trim());
            return true;
        }
    }

    return false;
}

// =====================================
// COMMUNICATION AVEC GROQ
// =====================================

async function envoyer() {
    const texte = input.value.trim();

    if (!texte || sendButton.disabled) return;

    ajouterMessage(texte, "user");

    input.value = "";

    if (traiterCommandeMemoire(texte)) {
        return;
    }

    historique.push({
        role: "user",
        content: texte
    });

    sauvegarderMemoire();

    sendButton.disabled = true;
    statusText.textContent = "J.A.R.V.I.S RÉFLÉCHIT...";

    try {
        const contexteMemoire = souvenirs.length
            ? "Voici les souvenirs enregistrés sur l'utilisateur. Utilise-les uniquement s'ils sont utiles à la question :\n" +
              souvenirs.map(s => "- " + s.memory).join("\n")
            : "Aucun souvenir longue durée n'est enregistré.";

        const messagesIA = [
            {
                role: "system",
                content: "MÉMOIRE LONGUE DURÉE :\n" + contexteMemoire
            },
            ...historique.slice(-12)
        ];

        const reponse = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: messagesIA
            })
        });

        const donnees = await reponse.json();

        if (!reponse.ok) {
            throw new Error(
                donnees.details ||
                donnees.error ||
                "Erreur du serveur"
            );
        }

        if (!donnees.reply) {
            throw new Error("Aucune réponse reçue.");
        }

        historique.push({
            role: "assistant",
            content: donnees.reply
        });

        historique = historique.slice(-12);
        sauvegarderMemoire();

        ajouterMessage(donnees.reply, "jarvis");

        statusText.textContent = "SYSTÈME OPÉRATIONNEL";

    } catch (erreur) {
        ajouterMessage("Erreur : " + erreur.message, "jarvis");
        statusText.textContent = "ERREUR DE CONNEXION";
    } finally {
        sendButton.disabled = false;
        input.focus();
    }
}

// =====================================
// ENTRÉE CLAVIER
// =====================================

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") envoyer();
});

// =====================================
// EFFACER LA CONVERSATION
// =====================================

function effacer() {
    historique = [];
    sauvegarderMemoire();

    messages.innerHTML = "";

    ajouterMessage(
        "Conversation effacée. Mes souvenirs longue durée sont conservés.",
        "jarvis"
    );

    statusText.textContent = "SYSTÈME EN ATTENTE";
}

// =====================================
// RECONNAISSANCE VOCALE
// =====================================

function parler() {
    const Reconnaissance =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Reconnaissance) {
        ajouterMessage(
            "La reconnaissance vocale n'est pas disponible sur ce navigateur.",
            "jarvis"
        );
        return;
    }

    const reconnaissance = new Reconnaissance();

    reconnaissance.lang = "fr-FR";
    reconnaissance.interimResults = false;

    reconnaissance.onstart = function() {
        statusText.textContent = "JE VOUS ÉCOUTE...";
    };

    reconnaissance.onresult = function(event) {
        input.value = event.results[0][0].transcript;
        envoyer();
    };

    reconnaissance.onerror = function() {
        statusText.textContent = "ERREUR MICRO";
    };

    reconnaissance.onend = function() {
        if (statusText.textContent === "JE VOUS ÉCOUTE...") {
            statusText.textContent = "SYSTÈME EN ATTENTE";
        }
    };

    reconnaissance.start();
}

// =====================================
// RESTAURATION DE SESSION
// =====================================

async function verifierSession() {
    const { data, error } = await client.auth.getSession();

    if (error) {
        console.error(error);
        return;
    }

    if (data.session) {
        utilisateur = data.session.user;

        document.getElementById("login").classList.add("hidden");
        document.getElementById("account").classList.remove("hidden");
        document.getElementById("accountEmail").textContent =
            "Connecté : " + utilisateur.email;

        try {
            await chargerSouvenirs();
            statusText.textContent = "SYSTÈME OPÉRATIONNEL";
        } catch {
            statusText.textContent = "ERREUR MÉMOIRE";
        }
    }
}

verifierSession();

</script>
</body>
</html>
